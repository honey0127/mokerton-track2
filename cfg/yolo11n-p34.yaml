# Ultralytics yolo11.yaml (scale n) 에서 P5 출력(층 20~22)과 Detect 의 P5 가지를 뗀 설계도.
# scripts/make_p34.py 가 만든다. 백본 P5 단계(층 7~10)는 남긴다.
nc: 80
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0
  - [-1, 1, Conv, [128, 3, 2]]  # 1
  - [-1, 2, C3k2, [256, false, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3
  - [-1, 2, C3k2, [512, false, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5
  - [-1, 2, C3k2, [512, true]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7
  - [-1, 2, C3k2, [1024, true]]  # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 11
  - [[-1, 6], 1, Concat, [1]]  # 12
  - [-1, 2, C3k2, [512, false]]  # 13
  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 14
  - [[-1, 4], 1, Concat, [1]]  # 15
  - [-1, 2, C3k2, [256, false]]  # 16
  - [-1, 1, Conv, [256, 3, 2]]  # 17
  - [[-1, 13], 1, Concat, [1]]  # 18
  - [-1, 2, C3k2, [512, false]]  # 19
  - [[16, 19], 1, Detect, [nc]]  # 20
